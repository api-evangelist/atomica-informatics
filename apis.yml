aid: atomica-informatics
name: Atomica Informatics
description: >-
  Atomica Informatics is an independent health-informatics consultancy founded and run by
  Dr Heather Leslie, specialising in what it calls "little data" design: the modelling of
  atomic clinical data so that individual data points carry consistent format and reliable
  meaning across projects, domains and systems instead of being locked into single-purpose
  silos. The practice delivers openEHR archetype and template authoring, clinical knowledge
  governance, clinician engagement, and openEHR clinical-modelling training - a two-day
  introductory course, advanced modelling workshops, and ongoing remote mentoring for
  in-house modelling teams. Dr Leslie pioneered the openEHR clinical modelling methodology
  in volunteer roles at the openEHR Foundation from 2006 and co-leads its Clinical Program.
  Atomica Informatics operates no API of its own; the machine-readable standards its work
  depends on are published by the openEHR Foundation.
